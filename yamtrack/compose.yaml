services:
  yamtrack:
    container_name: yamtrack
    image: ghcr.io/fuzzygrim/yamtrack
    restart: unless-stopped
    depends_on:
      - redis
    env_file:
      - .env
    volumes:
      - ./db:/yamtrack/db
    ports:
      - 10.0.0.1:8083:8000
  redis:
    container_name: yamtrack-redis
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - yamtrack_redis_data:/data
volumes:
  yamtrack_redis_data: null
networks: {}
